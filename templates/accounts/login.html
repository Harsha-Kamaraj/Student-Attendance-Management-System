{% extends "base.html" %}

{% block title %}Log in · Student Attendance{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-5">
      <h1 class="h3 mb-3">Log in</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="mt-3 mb-1"><a href="{% url 'forgot_password' %}">Forgot password?</a></p>
      <p class="form-text">
        Accounts are created by the Admin. After 5 failed attempts, login is paused for 15 minutes.
      </p>
    </div>
  </div>
{% endblock %}
