{% extends "base.html" %}

{% block title %}Create account · Student Attendance{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-md-6">
      <h1 class="h3 mb-3">Create account</h1>
      <p class="text-body-secondary">A one-time temporary password is generated. The user must change it at first login.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Create account</button>
        <a class="btn btn-link" href="{% url 'account_list' %}">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
