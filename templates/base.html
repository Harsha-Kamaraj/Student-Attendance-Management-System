<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">

  <title>{% block title %}Student Attendance Management System{% endblock %}</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-width: 320px;
      overflow-x: hidden;
    }

    img,
    svg {
      max-width: 100%;
      height: auto;
    }

    table {
      width: 100%;
    }

    .table-responsive {
      -webkit-overflow-scrolling: touch;
    }

    .navbar-text,
    a {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    @media (max-width: 575.98px) {
      .navbar .container {
        align-items: flex-start;
      }

      .navbar-brand {
        margin-bottom: 0.5rem;
      }

      .navbar .d-flex {
        width: 100%;
        flex-wrap: wrap;
        gap: 0.5rem !important;
      }

      .navbar-text {
        width: 100%;
      }

      main {
        overflow-x: hidden;
      }

      .card,
      .alert {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">

      <a class="navbar-brand" href="/">Student Attendance</a>

      {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">

          <span class="navbar-text text-white-50">
            {{ user.get_role_display|upper }} · {{ user.username }}
          </span>

          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}

            <button type="submit" class="btn btn-outline-light btn-sm">
              Log out
            </button>
          </form>

        </div>
      {% endif %}

    </div>
  </nav>

  <main class="container py-4">

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

  </main>

</body>
</html>
