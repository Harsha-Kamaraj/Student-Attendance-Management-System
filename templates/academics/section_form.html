{% extends "base.html" %}
{% block title %}Create class section · Student Attendance{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6">
  <h1 class="h3">Create class and section</h1>
  <p class="text-body-secondary">For example: Class “B.Tech CSE Year 2”, Section “A”.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Create section</button>
    <a href="{% url 'section_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}
