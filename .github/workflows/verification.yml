name: BL-29 and BL-31 verification

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "50-user request rounds (30 or more for the full sampling plan)"
        type: number
        default: 30
        required: true
      repeats:
        description: "60-student submission and semester-report repetitions (1-6)"
        type: number
        default: 3
        required: true

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verification_bl29_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: verification-ci-only-not-production
      DEBUG: "False"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/verification_bl29_ci
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SITE_URL: https://attendance.invalid
      ROUNDS: ${{ inputs.rounds }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact application and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Static and schema checks
        run: |
          ruff check .
          ruff format --check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Full integration, security and regression suite
        env:
          VERIFICATION_RESULTS: artifacts/tests.json
        run: python manage.py test --noinput --testrunner verification.test_runner.Runner
      - name: Declare targets before loading the capacity dataset
        run: python -m verification.performance plan --out artifacts/plan.json --rounds "$ROUNDS" --repeats "$REPEATS"
      - name: Migrate and load isolated synthetic capacity dataset
        run: |
          python manage.py migrate --noinput
          python -m verification.performance seed --plan artifacts/plan.json --out artifacts/seed.json
      - name: Measure 50 users, 60-student submissions and semester reports
        run: python -m verification.performance run --plan artifacts/plan.json --seed artifacts/seed.json --out artifacts/performance.json
      - name: Preserve measured evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bl29-bl31-verification
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  windows-verification:
    name: Windows PostgreSQL performance and recovery
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SECRET_KEY: verification-ci-only-not-production
      DEBUG: "False"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/verification_bl29_windows
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SITE_URL: https://attendance.invalid
      ROUNDS: ${{ inputs.rounds }}
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The action supports the runner's native PostgreSQL 17 on windows-2025.
      - uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca
        with:
          postgres-version: 17
          database: verification_bl29_windows
      - name: Install exact application and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Check source and database schema
        run: |
          ruff check .
          ruff format --check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Native Windows integration, ACL, junction and regression tests
        env:
          VERIFICATION_RESULTS: artifacts/windows-tests.json
        run: python manage.py test --noinput --testrunner verification.test_runner.Runner
      - name: Freeze plan and load the Windows capacity fixture
        run: |
          python -m verification.performance plan --out artifacts/windows-plan.json --rounds "$ROUNDS" --repeats "$REPEATS"
          python manage.py migrate --noinput
          python -m verification.performance seed --plan artifacts/windows-plan.json --out artifacts/windows-seed.json
      - name: Retest the unchanged BL29-v1 targets on Windows
        run: python -m verification.performance run --plan artifacts/windows-plan.json --seed artifacts/windows-seed.json --out artifacts/windows-performance.json
      - name: Exercise installed Chrome and Edge in a separate browser fixture
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/verification_bl29_browser_windows
        run: |
          pip install -r requirements-browser.txt
          psql -U postgres -h 127.0.0.1 -c "CREATE DATABASE verification_bl29_browser_windows"
          python manage.py migrate --noinput
          python -m verification.browser_check --engines chrome msedge --widths 1440 360 --out artifacts/windows-browser/results.json
      - name: Retain actual Windows outcomes even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bl29-windows-verification
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  browser-verification:
    name: Browser journeys at desktop and 360px
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verification_bl29_browser_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: verification-ci-only-not-production
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/verification_bl29_browser_ci
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SITE_URL: https://attendance.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Exercise real OTP, all roles, validation and narrow layouts
        run: |
          python manage.py migrate --noinput
          python -m verification.browser_check --engines chromium firefox webkit --widths 1440 360 --out artifacts/browser/results.json
      - name: Retain browser versions, outcomes and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bl30-browser-verification
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 30
